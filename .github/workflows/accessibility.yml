name: Accessibility

on:
  pull_request:
    branches: [ main ]
    paths:
      # App code and build config
      - 'web-app/**'
      - '.github/workflows/accessibility.yml'
      # Guide content: the suite loads the real markdown, so a long heading or
      # a wide table can legitimately break reflow even with no code change.
      - 'About.md'
      - 'About_es.md'
      - 'Directory.md'
      - 'Directory_es.md'
      - 'Resource guide.md'
      - 'Resource guide_es.md'
  workflow_dispatch: # Allow manual trigger

jobs:
  a11y-smoke:
    name: Accessibility Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        working-directory: web-app
        run: npm ci

      - name: Build app
        working-directory: web-app
        # build:novalidate skips the markdown lint and HTML validation that
        # other jobs already cover, so this job only pays for the build itself.
        run: npm run build:novalidate

      - name: Locate Chrome
        id: chrome
        run: |
          for candidate in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium-browser \
            /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using $candidate ($("$candidate" --version 2>/dev/null || echo 'version unknown'))"
              exit 0
            fi
          done
          echo "::error::No Chrome or Chromium binary found on the runner."
          exit 1

      - name: Start preview server
        working-directory: web-app
        run: |
          npx vite preview --port 4317 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          echo "Waiting for the preview server…"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4317/; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Preview server did not start within 30s"
          cat /tmp/preview.log
          exit 1

      - name: Run accessibility tests
        id: a11y
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          A11Y_URL: http://127.0.0.1:4317/
        run: |
          set -o pipefail
          echo "## Accessibility Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if npm --prefix web-app run test:a11y 2>&1 | tee /tmp/a11y.txt; then
            echo "✅ All accessibility assertions passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 3 /tmp/a11y.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Accessibility assertions failed**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(FAIL|PASS .*)' /tmp/a11y.txt | grep -E '^FAIL' >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See the job log for the full output. To reproduce locally:" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "cd web-app && npm run build" >> "$GITHUB_STEP_SUMMARY"
            echo "npm run preview -- --port 4317   # second terminal" >> "$GITHUB_STEP_SUMMARY"
            echo "npm run test:a11y" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-output
          path: /tmp/a11y.txt
          if-no-files-found: ignore
          retention-days: 14
